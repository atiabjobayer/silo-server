services:
  silo-transcode:
    build: .
    restart: unless-stopped
    environment:
      MODE: transcode
      PORT: "8080"
      # MUST be the EXACT SAME SECRET_KEY as the API server
      SECRET_KEY: "1kzrav+rohJnJLutwSFs+/dLKhW+PsVFob8hioZm0sdE+iQCZ29G2e+gof/SSSrj"
      DATABASE_URL: postgres://silo:silo@192.168.0.31:5432/silo?sslmode=disable
      REDIS_URL: redis://192.168.0.31:6379
      NODE_NAME: tc-1 # tc-2 on the other CT
    ports:
      - "8080:8080" # transcode API (called by the API server)
    volumes:
      - /var/lib/silo-transcode:/var/lib/silo-transcode
      - /mnt/media:/mnt/media:ro # .strm files (same path as API server)
      - /dev/dri:/dev/dri # Intel iGPU for QSV
    devices:
      - /dev/dri:/dev/dri